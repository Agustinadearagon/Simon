<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>SIMON</h1>
        
        <div class="info">
            <p>Ronda: <span id="ronda">0</span></p>
            <p id="mensaje">Pulsa EMPEZAR para jugar</p>
        </div>

        <div class="tablero">
            <div class="boton verde" id="verde" data-color="verde"></div>
            <div class="boton rojo" id="rojo" data-color="rojo"></div>
            <div class="boton amarillo" id="amarillo" data-color="amarillo"></div>
            <div class="boton azul" id="azul" data-color="azul"></div>
        </div>

        <button id="empezar">EMPEZAR</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
